extends: spatial_warmup_resume_hair_incontext.yaml

# Quality-repair continuation from the completed 4400-step spatial run.
# The reference-canvas changes are intentionally isolated to the reference
# cache keys; target/PuLID/pose caches remain untouched.
experiment:
  id: phase1_spatial_quality_repair_r16_6400_768x1024
  wandb_run_id: phase1_spatial_quality_repair_r16_6400_768x1024

data:
  cache_dir: phase1/cache_spatial_quality_repair_768x1024
  identity_bank: derived/identity_bank_v2.npz
  identity_bank_v2: derived/identity_bank_v2.npz
  exclude_train_ids: ["47160"]

model:
  load_vae_in_train: true
  identity_adapter:
    # The failed token route is removed from the transformer sequence. Keep its
    # parameter slots only so the old optimizer state remains shape-compatible.
    use_hair_tokens: false
    retain_legacy_hair_parameters_for_resume: true
  train_recognizer:
    type: arcface_torch_glint360k
    architecture: iresnet100
    backend: onnx2torch_glintr100
    checkpoint: /data/muxiangyu/modelLibrary/insightface/models/antelopev2/glintr100.onnx
    embedding_dim: 512
    input_size: 112
    detector_name: antelopev2
    detector_model_root: /data/muxiangyu/modelLibrary/insightface
    detector_checkpoint: /data/muxiangyu/modelLibrary/insightface/models/antelopev2/scrfd_10g_bnkps.onnx
    det_size: 640
    detector_threshold: 0.1
    detector_face_crop_pad: 0.6
    detector_min_face_crop_px: 320
    detector_intra_op_threads: 8
    detector_inter_op_threads: 1
    bank_min_det_conf: 0.3
    train_min_det_conf: 0.5
  spatial_conditions:
    garment_reference:
      enabled: true
      stride: 1
      x_offset: 64
    hair:
      enabled: true
      reference:
        enabled: true
        stride: 2
        y_offset: 64
    head_control:
      synthetic_probability: 0.25
      shoulder_scale: 0.47
      nose_offset_scale: 1.55

cache:
  # Match the mannequin parsing-background statistic instead of the old 127
  # canvas. Only garment/hair reference images use these overrides.
  reference_neutral_gray: 227
  reference_mask_erosion_px: 2
  hair_ref_min_area_fraction: 0.005

training:
  # 4400 -> 6400 is exactly 2000 new optimizer steps.
  total_steps: 6400
  additional_steps: null
  resume: /data/muxiangyu/datasets/M2HImage/M2H_Final_v2/phase1/phase1_spatial_hair_incontext_fixedset_resume_r16_4400_768x1024/checkpoints/final
  paired_region_weighting:
    enabled: true
    w_cloth: 2.0
    w_hair: 2.0
    w_face: 2.0
  hair_loss:
    enabled: true
    mask_source: target_projection
    decode_freq: 2
    tau_min: 0.30
    tau_max: 0.75
    lambda_hair: 0.50
    dino_precision: bf16
    min_hair_area_fraction: 0.005
    max_skip_rate: 0.15
    compensate_grad_accum: true
    gradient_checkpointing: true
  differential:
    enabled: true
    sampling: semihard
    semihard_pool: 8
    sampling_log_every: 100
    lambda_teach: 0.5
    lambda_inv: 0.2
    lambda_hinge: 0.05
    tau_min: 0.2
    tau_max: 0.8
    diff_every: 1
    # This continuation starts from a non-differential checkpoint. Collect a
    # fresh 200-step calibration window from this launch, not old run origin.
    calibration_steps: 200
    calibration_from_launch: true
    hinge_g: null
    hinge_g_resolved: null
    smoke_hinge_g: 1.0
    collapse_window_steps: 500
    collapse_drop_fraction: 0.30
    decode:
      enabled: true
      freq: 3
      both: false
      tau_min: 0.35
      tau_max: 0.70
      # Full grad-accum=6 measured 44.01498 GiB at 0.50. The recognizers resize
      # to fixed 112/518 inputs, so this minimal reduction preserves their
      # interfaces while restoring the strict 44 GiB training headroom.
      latent_scale: 0.48
      gradient_checkpointing: true
    identity_loss:
      enabled: true
      recognizer: train_arcface_glint360k
      margin: 0.1
      lambda_dir: 0.1
      lambda_abs: 0.05
      min_detection_confidence: 0.5
      max_skip_rate: 0.5
      compensate_grad_accum: true

eval:
  b2_output_dir: eval/spatial_quality_repair_gen
  report_path: eval/spatial_quality_repair_report.md
  watcher_eval_set: configs/watcher_eval_set.json
  fixed_val_count: 16
  manual_review_step: 0
  response_track:
    enabled: true
    output_dir: artifacts/response_track_quality_repair
    metrics_config: configs/spatial_metrics_v2.yaml
    sample_count: 16
    metric_sample_count: 16
    visible_hair_sample_count: 16
    visible_hair_min_fraction: 0.01
    seed: 20260820
    taus: [0.3, 0.5, 0.7]
    baseline_snapshot: artifacts/rebaseline_fixed_set/step4400.json
    historical_snapshots: []
    required_history_steps: [4400]
    auto_backfill: false
    trend_gate_steps: [5000, 5500, 6000]
    hard_stop_step: 6000
    hair_hard_stop_step: 6000
    garment_median_tolerance: 0.02
    # The fixed val protocol has a different distribution from the 400-image
    # system suite: repaired-input step-4400 median=0.755753. Keep the watcher
    # on its preregistered baseline-0.02 guard; enforce 0.92 only at full eval.
    garment_absolute_min: 0.735753
    head5_median_tolerance: 0.005
    head5_absolute_max: 0.024
    body_median_tolerance: 0.005
    body_absolute_max: 0.015
    min_face_detection_rate: 0.97
    swap_regression_tolerance: 0.05
    max_swap_cosine: 0.36
    regression_intervals_to_stop: 2
    regression_checkpoints_to_stop: 2
    garment_negative_intervals_to_stop: 2
    hair_concentration_min: 1.10
    dino_positive_slope: 0.0
    dino_plateau_slope: 0.001
    visual_regression_marker: VISUAL_REGRESSION

metrics:
  output_dir: eval/spatial_quality_repair_legacy_metrics

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "m2himage"
version = "0.3.0"
description = "FLUX paired warmup, A2 differential training, and B2/A2 gate evaluation for M2HImage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "timm",
  "onnxruntime",
  "facexlib",
  "torchsde",
  "SentencePiece",
  "ftfy",
  "accelerate",
  "bitsandbytes",
  "diffusers",
  "insightface",
  "lpips==0.1.4",
  "matplotlib",
  "numpy",
  "onnx",
  "onnx2torch==1.5.15",
  "opencv-python",
  "peft",
  "Pillow",
  "PyYAML",
  "safetensors",
  "scikit-image",
  "scipy",
  "torch",
  "torch-fidelity==0.3.0",
  "torchvision",
  "tqdm",
  "transformers",
  "uniface==3.7.1",
  "wandb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["metrics", "metrics_v2"]
py-modules = [
  "build_cache",
  "build_identity_bank",
  "build_identity_bank_v2",
  "build_region_masks_z",
  "conditions",
  "dataset",
  "eval_b2",
  "eval_b2_metrics",
  "eval_b2_make_vis",
  "eval_a4_gate_report",
  "eval_gate_report",
  "eval_interp_reports",
  "eval_metrics_v2",
  "eval_protected_gate",
  "eval_watcher",
  "analyze_id_velocity",
  "interp_common",
  "interp_identity",
  "interp_weights",
  "human_eval_build",
  "human_eval_score",
  "make_qual_panels",
  "pulid_flux",
  "hair_supervision",
  "manual_review_gate",
  "spatial_conditions",
  "synth_head_keypoints",
  "tile_multicontrol_probe",
  "qual_eval_common",
  "run_interpolation",
  "sampling_protected",
  "speed_bench",
  "diagnose_a2",
  "train_paired",
  "train_recognizer",
]

[tool.ruff]
line-length = 140
target-version = "py310"
